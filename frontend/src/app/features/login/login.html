<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login-card__title">Control de Asistencia</h1>
    <p class="login-card__subtitle">Inicia sesión con tu cuenta</p>

    <label class="field">
      <span class="field__label">Email</span>
      <input
        class="field__input"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="usuario@empresa.com"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Ingresa un email válido</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Contraseña</span>
      <input
        class="field__input"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">La contraseña es obligatoria</span>
      }
    </label>

    @if (error()) {
      <p class="login-card__error">{{ error() }}</p>
    }

    <button class="login-card__button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
