spring.application.name=principal

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_empleados?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (esquema gestionado por db/gestion_empleados.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT
security.jwt.secret=${JWT_SECRET:dev-secret-key-for-local-use-only-change-me-1234567890}
security.jwt.expiration=3600000

# CORS (frontend Angular en desarrollo)
app.cors.allowed-origins=http://localhost:4200
